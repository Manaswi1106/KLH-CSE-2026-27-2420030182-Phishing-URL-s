<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhishXpert</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .search {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .hidden {
            display: none;
        }

        .evidence {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .topic {
            font-weight: bold;
            margin-bottom: 5px;
        }

        #prediction {
            font-size: 28px;
            font-weight: bold;
        }

        #explanation {
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ PhishXpert</h1>

    <p style="text-align:center;">
        Knowledge-Grounded Explainable Phishing Detection
    </p>

    <div class="search">

        <input
            id="url"
            type="text"
            placeholder="Enter website URL"
        >

        <button onclick="analyzeURL()">
            Check URL
        </button>

    </div>

    <div id="loading" class="hidden">
        Analyzing webpage...
    </div>

    <div id="result" class="card hidden">

        <h2>Detection Result</h2>

        <p>
            Prediction:
            <span id="prediction"></span>
        </p>

        <p>
            Confidence:
            <span id="confidence"></span>
        </p>

        <p>
            Access Status:
            <span id="access"></span>
        </p>

        <p>
            Feature Mode:
            <span id="featureMode"></span>
        </p>

        <h2>Retrieved Cybersecurity Evidence</h2>

        <div id="evidence"></div>

        <h2>Gemini Explanation</h2>

        <div id="explanation"></div>

    </div>

</div>


<script>

async function analyzeURL() {

    const url = document.getElementById("url").value.trim();

    if (!url) {
        alert("Please enter a URL.");
        return;
    }

    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");

    try {

        const response = await fetch("/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                url: url
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Prediction failed"
            );
        }

        document.getElementById("prediction").textContent =
            data.prediction;

        document.getElementById("confidence").textContent =
            data.confidence + "%";

        document.getElementById("access").textContent =
            data.access_status;

        document.getElementById("featureMode").textContent =
            data.feature_mode;

        document.getElementById("explanation").textContent =
            data.explanation;

        const evidenceContainer =
            document.getElementById("evidence");

        evidenceContainer.innerHTML = "";

        data.rag_evidence.forEach(item => {

            const div = document.createElement("div");

            div.className = "evidence";

            div.innerHTML = `
                <div class="topic">
                    ${item.topic}
                </div>

                <div>
                    Similarity: ${item.score.toFixed(4)}
                </div>

                <p>
                    ${item.content}
                </p>
            `;

            evidenceContainer.appendChild(div);

        });

        document.getElementById("result")
            .classList.remove("hidden");

    }

    catch (error) {

        alert(
            "Error: " + error.message
        );

    }

    finally {

        document.getElementById("loading")
            .classList.add("hidden");

    }

}

</script>

</body>
</html>
